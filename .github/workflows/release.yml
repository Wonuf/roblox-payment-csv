name: Build release

# Push a tag like v1.0.0 to build the .exe and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm --onefile --name RobloxPayoutCSV --add-data "index.html;." app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RobloxPayoutCSV
          path: dist/RobloxPayoutCSV.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RobloxPayoutCSV.exe
